<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="Script to Clearance">
  <!-- A favicon inherits no colour and lands on unknown browser chrome, so the
       mark is knocked out of a filled tile rather than drawn in currentColor.
       Lens cone and perforations are dropped: at 16px they are noise. -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <g fill="none" stroke="#f8fafc" stroke-width="2">
    <circle cx="11.6" cy="10.4" r="5"/>
    <circle cx="20.4" cy="11.6" r="3.7"/>
    <rect x="5.6" y="17" width="20.8" height="9.6" rx="1.8"/>
  </g>
  <g>
    <rect x="7.8"  y="19.6" width="5.4" height="4.4" rx="1" fill="#ef4444"/>
    <rect x="14.1" y="19.6" width="5.4" height="4.4" rx="1" fill="#f59e0b"/>
    <rect x="20.4" y="19.6" width="3.4" height="4.4" rx="1" fill="#10b981"/>
  </g>
</svg>
