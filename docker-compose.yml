version: '3.8'

services:
  # 1. Algorithmic Fast-Path (Execution Layer)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis:6379
      - PROMETHEUS_URL=http://prometheus:9090
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis
      - prometheus

  # 2. Control Panel & Human-in-the-loop Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

  # 3. Queue State & Metadata Storage
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # 4. Simulated GPU Telemetry
  dcgm-exporter:
    image: ghcr.io/saiakhil2012/dcgm-fake-gpu-exporter:latest
    ports:
      - "9400:9400"
    environment:
      - NUM_FAKE_GPUS=4
      - METRIC_PROFILE=spike
    restart: unless-stopped

  # 5. Local Telemetry Aggregator
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - dcgm-exporter